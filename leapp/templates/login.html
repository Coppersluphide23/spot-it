{% extends 'base.html' %}
{% block title%}Register User{%endblock%}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
        <h2 class="text-warning text-center">LOGIN</h2>
        <form method="POST" class="card p-3">
            {%csrf_token%}
            {{form.as_p}}
            <button class="btn btn-info" type="submit" >LOGIN</button>
            <p class="text-center">Don't have an account? Register here <a href="{% url 'register' %}"></a></p>
            </form>
    </div>

  </div>
</div>
{% endblock %}
