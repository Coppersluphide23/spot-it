{% extends 'base.html' %}
{% block title %}Register User{% endblock %}
{% block content %}
<div class="container py-5">
<div class="row justify-content-center">
	<div class="col-md-6">
		<h2>Registration Form</h2>
		<form method="POST">
			{% csrf_token %}
			{{ form.as_p }}
			<button class="btn btn-info" type="submit">Register</button>
		</form>
	</div>
</div>
</div>
{% endblock %}
